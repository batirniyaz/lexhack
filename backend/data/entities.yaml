# Who owns a third-party host, and where that company is registered.
# Matching: a host matches a domain if it equals it or ends with "." + domain. Most specific (longest) domain wins.
# country = ISO 3166-1 alpha-2 of the company that receives the data (legal entity), not the server location.
# dpf = participates in the EU-US Data Privacy Framework (relevant for CMR No. 415 "US only for DPF participants").
#       Values are NOT VERIFIED — check on https://www.dataprivacyframework.gov/list before the pitch (Role 2).
# category: analytics | advertising | social | tag_manager | session_replay | cdn | fonts | hosting | payments |
#           crm | chat | captcha | ab_testing | maps | translation | marketing | government | other
entities:
  - name: Google
    country: US
    dpf: true
    domains: [google-analytics.com, analytics.google.com, googletagmanager.com, doubleclick.net, googleadservices.com,
              googlesyndication.com, google.com, google.co.uz, google.ru, gstatic.com, googleapis.com, youtube.com,
              ytimg.com, googleusercontent.com, firebaseio.com, firebasedatabase.app, firebaseapp.com, recaptcha.net]
    category_by_domain:
      google-analytics.com: analytics
      analytics.google.com: analytics
      googletagmanager.com: tag_manager
      doubleclick.net: advertising
      googleadservices.com: advertising
      googlesyndication.com: advertising
      gstatic.com: cdn
      fonts.googleapis.com: fonts
      fonts.gstatic.com: fonts
      translate.googleapis.com: translation
      translate.google.com: translation
      firebaseio.com: hosting
      firebasedatabase.app: hosting
      firebaseapp.com: hosting
    category: other
  - name: Meta
    country: US
    dpf: true
    domains: [facebook.net, facebook.com, fbcdn.net, instagram.com, cdninstagram.com, whatsapp.net]
    category_by_domain:
      facebook.net: advertising
      facebook.com: advertising
    category: social
