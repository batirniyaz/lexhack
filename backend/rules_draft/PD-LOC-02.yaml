id: PD-LOC-02
title:
  en: "Trackers send visitor identifiers to a country outside the adequate-protection list"
  ru: "Трекеры передают идентификаторы посетителей в страну вне перечня"
  uz: "Trekerlar tashrif buyuruvchi identifikatorlarini roʻyxatga kirmagan davlatga yubormoqda"
level: risk
detector: foreign_requests
params:
  categories: [analytics, advertising, session_replay, social, marketing, ab_testing]
  flag_statuses: [not_listed, not_in_known_list, conditional_unknown]
legal_basis:
  - act: "ZRU-547"
    article: "27¹, part 3 (ed. ZRU-1125 of 26.03.2026); art. 15 (cross-border transfer)"
    articles: ["27¹", "15"]   # article numbers the rule relies on
    quote_uz: null
    quote_ru: null
    url: "https://lex.uz/docs/-4396419"
    edition_date: "2026-09-12"
sanction: "Uncertain: Administrative Code art. 46² part 1 still uses the pre-2026 localization wording (not aligned with art. 27¹ as amended by ZRU-1125); no sanction if one of the art. 27¹ part 3 bases exists."
sanction_uz: "Noaniqlik: MJtK 46²-moddasi 1-qismida lokalizatsiya boʻyicha 2021-yilgi matn saqlangan va yangi 27¹-modda bilan muvofiqlashtirilmagan; 27¹-modda 3-qismidagi asoslardan biri boʻlsa, sanksiya yoʻq."
sanction_ru: "Неопределённость: КоАО ст. 46² ч. 1 сохраняет формулировку о локализации 2021 года, не согласованную с новой ст. 27¹; санкции нет, если есть одно из оснований ст. 27¹ ч. 3."
sanction_source: "R-02 research/legal-liability.md (21.11.2026), not a lawyer's opinion"
fix:
  en: "Remove the tracker, switch to a provider in Uzbekistan or a listed country, or document the legal ground. Whether IP/cookie IDs are personal data is still open (V-08)."
  ru: "Уберите трекер, перейдите на провайдера в Узбекистане или в стране из перечня, либо оформите основание. Являются ли IP и cookie-ID персданными — открытый вопрос (V-08)."
  uz: "Trekerni olib tashlang, Oʻzbekistondagi yoki roʻyxatdagi davlatdagi provayderga oʻting yoki asosni hujjatlashtiring."
verified: false
author: "Role 1 draft"
