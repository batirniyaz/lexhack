id: PD-TRK-01
title:
  en: "Trackers load on the first visit, before any consent"
  ru: "Трекеры загружаются при первом визите, до какого-либо согласия"
  uz: "Trekerlar birinchi tashrifda, hech qanday roziliksiz yuklanmoqda"
level: risk
detector: trackers_before_consent
params:
  categories: [analytics, advertising, session_replay, social, marketing, ab_testing]
legal_basis:
  - act: "ZRU-547"
    article: "21 (giving and withdrawing consent)"
    articles: ["18", "21"]   # article numbers the rule relies on
    quote_uz: null
    quote_ru: null
    url: "https://lex.uz/ru/docs/4396428"
    edition_date: null
sanction: null
fix:
  en: "Load analytics and advertising scripts only after the visitor agrees (consent banner), or document why consent is not required."
  ru: "Загружайте аналитику и рекламные скрипты только после согласия посетителя (баннер согласия) или обоснуйте, почему согласие не требуется."
  uz: "Analitika va reklama skriptlarini faqat tashrif buyuruvchi rozilik bergandan keyin yuklang (rozilik banneri)."
verified: false
author: "Role 1 draft"
sanction_uz: "Agar tashrif buyuruvchi identifikatorlari (IP, cookie) shaxsga doir maʼlumot deb topilsa: MJtK 46²-moddasi 1-qismi (7 / 50 BHM = 3 080 000 / 22 000 000 soʻm). Bu masala hali ochiq."
sanction_ru: "Если идентификаторы посетителей (IP, cookie) признают персональными данными: КоАО ст. 46² ч. 1 (7 / 50 БРВ = 3 080 000 / 22 000 000 сум). Вопрос пока открыт."
sanction_source: "Role 2 rules (research/legal-liability.md, research/legal-ecommerce.md); BCA 440,000 UZS from 01.09.2026 (PF-115); interpretation, not a lawyer's opinion"
