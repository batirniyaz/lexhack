  ru: "Загружайте аналитику и рекламные скрипты только после согласия посетителя (баннер согласия) или обоснуйте, почему согласие не требуется."
  uz: "Analitika va reklama skriptlarini faqat tashrif buyuruvchi rozilik bergandan keyin yuklang (rozilik banneri)."
