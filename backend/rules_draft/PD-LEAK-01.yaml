id: PD-LEAK-01
title:
  en: "Personal data (email / phone) leaks to third parties in request URLs"
  ru: "Персданные (e-mail / телефон) утекают третьим лицам в адресах запросов"
  uz: "Shaxsga doir maʼlumotlar (e-mail / telefon) soʻrov manzillarida uchinchi shaxslarga oqib ketmoqda"
level: violation
detector: url_pii
legal_basis:
  - act: "ZRU-547"
    article: "13 (providing personal data), 28 (confidentiality) — NOT VERIFIED"
    articles: ["13", "28"]   # article numbers for verbatim citations (qalqon.legal.citations)
    quote_uz: null
    quote_ru: null
    url: "https://lex.uz/ru/docs/4396428"
    edition_date: null
sanction: "Administrative Code art. 46² part 1 — fine 7 BCA (3,080,000 UZS) for citizens, 50 BCA (22,000,000 UZS) for officials; after a penalty, within 1 year — Criminal Code art. 141² (100–150 BCA). BCA 440,000 UZS from 01.09.2026 (PF-115)."
sanction_uz: "MJtK 46²-moddasi 1-qismi: fuqarolarga 7 BHM (3 080 000 soʻm), mansabdor shaxslarga 50 BHM (22 000 000 soʻm) jarima. Jazodan keyin bir yil ichida takrorlansa — JK 141²-moddasi."
sanction_ru: "КоАО ст. 46² ч. 1: штраф гражданам 7 БРВ (3 080 000 сум), должностным лицам 50 БРВ (22 000 000 сум). Повторно в течение года после взыскания — УК ст. 141²."
sanction_source: "R-02 research/legal-liability.md (21.11.2026), not a lawyer's opinion"
fix:
  en: "Never put personal data into URLs; strip query parameters before they reach analytics."
  ru: "Не помещайте персданные в URL; очищайте параметры до передачи в аналитику."
  uz: "Shaxsga doir maʼlumotlarni URL ga qoʻymang."
verified: false
author: "Role 1 draft"
