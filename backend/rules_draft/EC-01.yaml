fix:
  en: "Show the seller's full legal name, taxpayer number (STIR), postal address, phone and e-mail in the footer and in the public offer."
  ru: "Укажите в подвале сайта и в публичной оферте полное наименование продавца, ИНН (STIR), почтовый адрес, телефон и e-mail."
  uz: "Sayt pastki qismida va ommaviy ofertada sotuvchining toʻliq nomi, STIR, pochta manzili, telefon va e-mailini koʻrsating."
verified: false
author: "Role 1 draft (norms from lex.uz 21.11, confirmed by Role 2 in rules/)"
sanction_uz: "Ehtimoliy: MJtK 178-moddasi 6-qismi (isteʼmolchiga maʼlumot bermaslik) — fuqarolarga 3–7 BHM (1 320 000 – 3 080 000 soʻm), mansabdor shaxslarga 7–10 BHM (3 080 000 – 4 400 000 soʻm), musodara bilan."
sanction_ru: "Возможно: КоАО ст. 178 ч. 6 (непредоставление информации потребителю) — гражданам 3–7 БРВ (1 320 000 – 3 080 000 сум), должностным лицам 7–10 БРВ (3 080 000 – 4 400 000 сум), с конфискацией."
sanction_source: "Role 2 rules (research/legal-liability.md, research/legal-ecommerce.md); BCA 440,000 UZS from 01.09.2026 (PF-115); interpretation, not a lawyer's opinion"
