id: PD-CNS-01
title:
  en: "A form collects personal data without visible consent or notice"
  ru: "Форма собирает персональные данные без видимого согласия или уведомления"
  uz: "Shakl shaxsga doir maʼlumotlarni koʻrinadigan rozilik yoki xabarnomasiz yigʻmoqda"
level: risk   # R-01 (art. 18, model procedure item 9): a form without a checkbox can be lawful (request before a contract, accepted offer)
detector: form_consent
legal_basis:
  - act: "ZRU-547"
    article: "21 (giving and withdrawing consent)"
    articles: ["18", "21"]   # article numbers the rule relies on
    quote_uz: null
    quote_ru: null
    url: "https://lex.uz/ru/docs/4396428"
    edition_date: null
sanction: "Administrative Code art. 46² part 1 — fine 7 BCA (3,080,000 UZS) for citizens, 50 BCA (22,000,000 UZS) for officials; after a penalty, within 1 year — Criminal Code art. 141² (100–150 BCA). BCA 440,000 UZS from 01.09.2026 (PF-115)."
fix:
  en: "Add a consent checkbox (not pre-ticked) with a link to the personal-data policy, the purpose and the list of data."
  ru: "Добавьте чекбокс согласия (без предустановленной галочки) со ссылкой на политику обработки персданных, целью и перечнем данных."
  uz: "Shaxsga doir maʼlumotlar siyosatiga havola, maqsad va maʼlumotlar roʻyxati bilan rozilik belgisini (oldindan belgilanmagan) qoʻshing."
verified: false
author: "Role 1 draft"
fine_bca_official_max: 50   # for the report's 'possible fine' figure (officials)
fine_article: "MJtK / КоАО 46²-1"
