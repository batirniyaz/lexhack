id: PD-PII-01
title:
  en: "A form asks for sensitive identifiers (passport, PINFL, card, photo)"
  ru: "Форма запрашивает чувствительные данные (паспорт, ПИНФЛ, карта, фото)"
  uz: "Shakl nozik maʼlumotlarni soʻramoqda (pasport, JShShIR, karta, rasm)"
level: risk
detector: form_pd_fields
params:
  categories: [passport, pinfl, card, photo]
legal_basis:
  - act: "ZRU-547"
    article: "5 (principles), 19 (processing requirements) — purpose limitation and proportionality (NOT VERIFIED)"
    articles: ["10", "19"]   # article numbers the rule relies on
    quote_uz: null
    quote_ru: null
    url: "https://lex.uz/ru/docs/4396428"
    edition_date: null
sanction: null
fix:
  en: "Ask for these data only if the stated purpose requires them; card numbers belong on the payment provider's page."
  ru: "Запрашивайте эти данные, только если этого требует заявленная цель; номер карты — на странице платёжного провайдера."
  uz: "Bu maʼlumotlarni faqat maqsad talab qilsa soʻrang; karta raqami toʻlov provayderi sahifasida kiritilsin."
verified: false
author: "Role 1 draft"
sanction_uz: "Faqat yigʻish maqsaddan ortiq va qonunga xilof boʻlsa: MJtK 46²-moddasi 1-qismi (7 / 50 BHM = 3 080 000 / 22 000 000 soʻm); buni yurist hal qiladi."
sanction_ru: "Только если сбор сверх цели незаконен: КоАО ст. 46² ч. 1 (7 / 50 БРВ = 3 080 000 / 22 000 000 сум); это решает юрист."
sanction_source: "Role 2 rules (research/legal-liability.md, research/legal-ecommerce.md); BCA 440,000 UZS from 01.09.2026 (PF-115); interpretation, not a lawyer's opinion"
