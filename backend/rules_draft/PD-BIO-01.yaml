id: PD-BIO-01
title:
  en: "Possible biometric data (selfie / camera) — must be stored in Uzbekistan"
  ru: "Возможные биометрические данные (селфи / камера) — обязаны храниться в Узбекистане"
  uz: "Ehtimoliy biometrik maʼlumotlar (selfi / kamera) — Oʻzbekistonda saqlanishi shart"
level: risk
detector: biometric_capture
legal_basis:
  - act: "ZRU-547"
    article: "27¹, part 2 (ed. ZRU-1125 of 26.03.2026); art. 26"
    articles: ["27¹", "26"]   # article numbers the rule relies on
    quote_uz: "Quyidagi shaxsga doir maʼlumotlar Oʻzbekiston Respublikasi hududida saqlanishi shart: jismoniy shaxslarning biometrik maʼlumotlari; jismoniy shaxslarning genetik maʼlumotlari; …"
    quote_ru: "Обязательному хранению на территории Республики Узбекистан подлежат следующие персональные данные: биометрические данные физических лиц; генетические данные физических лиц; …"
    url: "https://lex.uz/docs/-4396419"
    url_ru: "https://lex.uz/ru/docs/4396428"
    edition_date: "2026-09-12"
sanction: "Administrative Code art. 46² part 1 (storage on technical means in Uzbekistan) — 7 BCA citizens / 50 BCA officials; repeat after a penalty — Criminal Code art. 141²; risk of listing in the register of violators and access restriction (CMR No. 707, annex 3)."
fix:
  en: "Confirm where uploaded photos are stored and processed; biometric data must stay on servers in Uzbekistan."
  ru: "Подтвердите, где хранятся и обрабатываются загружаемые фото; биометрия должна оставаться на серверах в Узбекистане."
  uz: "Yuklangan rasmlar qayerda saqlanishini tasdiqlang; biometrik maʼlumotlar Oʻzbekistondagi serverlarda qolishi shart."
verified: false
author: "Role 1 draft"
fine_bca_official_max: 50   # for the report's 'possible fine' figure (officials)
fine_article: "MJtK / КоАО 46²-1"
sanction_uz: "MJtK 46²-moddasi 1-qismi (7 / 50 BHM) + buzuvchilar reyestriga kiritilish va saytga kirish cheklanishi xavfi (VMQ 707, 3-ilova)."
sanction_ru: "КоАО ст. 46² ч. 1 (7 / 50 БРВ) + риск внесения в Реестр нарушителей и ограничения доступа к сайту (ПКМ № 707, прил. 3)."
sanction_source: "R-02 research/legal-liability.md (21.11.2026), not a lawyer's opinion"
