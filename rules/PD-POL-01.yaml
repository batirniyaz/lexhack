# Role 2 rule (R-03). Overrides backend/rules_draft/PD-POL-01.yaml.
# Verified 21.11.2026 against live lex.uz (ZRU-547 edition of 12.09.2026; uz quotes from lex.uz's Latin version).
# Level: risk — no norm says "publish a privacy policy on the website". The law requires written notice of purposes and
# rights when data enters a database (art. 23 part 1) and information on request (art. 22); the model procedure requires
# an internal policy document (item 30, point 12). A public policy is the usual way to meet these duties, so its absence
# on a site that collects data is a sign that the notice is missing.
id: PD-POL-01
title:
  en: "No personal-data policy found on the site"
  ru: "На сайте не найдена политика обработки персональных данных"
  uz: "Saytda shaxsga doir maʼlumotlarga ishlov berish siyosati topilmadi"
level: risk
detector: privacy_policy_present
legal_basis:
  - act: "ZRU-547 «Shaxsga doir maʼlumotlar toʻgʻrisida» / «О персональных данных»"
    article: "23, part 1 (written notice of purposes and rights)"
    articles: ["23"]
    quote_uz: "Subyekt oʻzining shaxsga doir maʼlumotlari shaxsga doir maʼlumotlar bazasiga kiritilayotganda shaxsga doir maʼlumotlarga ishlov berish maqsadlari, ushbu Qonunning 30-moddasida belgilangan oʻz huquqlari haqida yozma shaklda xabardor qilinishi kerak."
    quote_ru: "Субъект при включении его персональных данных в базу персональных данных должен быть уведомлен в письменной форме о целях обработки персональных данных, его правах, определенных статьей 30 настоящего Закона."
    url: "https://lex.uz/docs/-4396419"
    url_ru: "https://lex.uz/ru/docs/4396428"
    edition_date: "12.09.2026"
  - act: "ZRU-547"
    article: "22, part 1 (information on processing)"
    articles: ["22"]
    quote_uz: "Subyekt oʻzining shaxsga doir maʼlumotlariga ishlov berishga taalluqli boʻlgan, quyidagilar koʻrsatilgan axborotni olish huquqiga ega:"
    quote_ru: "Субъект имеет право на получение информации, касающейся обработки его персональных данных, содержащей:"
    url: "https://lex.uz/docs/-4396419"
    url_ru: "https://lex.uz/ru/docs/4396428"
    edition_date: "12.09.2026"
  - act: "Minister of Justice order No. 20-mh of 15.11.2023 — Model procedure of processing personal data (reg. No. 3478)"
    article: "30, point 12 (internal policy documents); text in Uzbek only"
    quote_uz: "shaxsga doir maʼlumotlarga ishlov berish va ularni himoya qilish boʻyicha mulkdor va (yoki) operator siyosatini belgilaydigan ichki hujjatlarni tasdiqlashi;"
    quote_ru: null
    url: "https://lex.uz/docs/-6663967"
    edition_date: "15.11.2023"
sanction: null   # no separate offence for a missing policy; see research/legal-liability.md
fix:
  en: "Publish a personal-data policy and link it from every form and the footer: operator and postal address, legal grounds and purposes, data collected, retention, recipients and countries (incl. transfer abroad), the subject's rights and how to use them, a contact for requests."
  ru: "Опубликуйте политику обработки персональных данных и дайте ссылку на неё у каждой формы и в подвале: оператор и почтовый адрес, основания и цели, состав данных, сроки хранения, получатели и страны (в том числе передача за рубеж), права субъекта и порядок их реализации, контакт для обращений."
  uz: "Shaxsga doir maʼlumotlarga ishlov berish siyosatini eʼlon qiling va har bir shakl hamda sayt pastki qismida unga havola bering: operator va pochta manzili, asoslar va maqsadlar, yigʻiladigan maʼlumotlar, saqlash muddatlari, qabul qiluvchilar va davlatlar (xorijga uzatish ham), subyekt huquqlari va ulardan foydalanish tartibi, murojaat uchun aloqa."
verified: true
author: "Role 2 (R-03, 21.11.2026)"
