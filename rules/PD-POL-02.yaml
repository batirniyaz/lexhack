# Role 2 rule (R-03). Overrides backend/rules_draft/PD-POL-02.yaml.
# Verified 21.11.2026 against live lex.uz (ZRU-547 edition of 12.09.2026; uz quotes from lex.uz's Latin version).
# Level: risk. Core items = purposes and the subject's rights (art. 23 part 1 — notice at collection); the rest of the
# checklist comes from art. 22 part 1 (grounds and purposes, methods, operator name and postal address, recipients,
# data and source, retention, how to use the rights, cross-border transfer). "cookies" has no norm (V-08) — never a
# reason on its own. Mapping of policy.py ELEMENTS to the law: research/legal-norms.md, section 4.
id: PD-POL-02
title:
  en: "The policy lacks items the law requires"
  ru: "В политике нет пунктов, которых требует закон"
  uz: "Siyosatda qonun talab qiladigan bandlar yoʻq"
level: risk
detector: policy_content
legal_basis:
  - act: "ZRU-547 «Shaxsga doir maʼlumotlar toʻgʻrisida» / «О персональных данных»"
    article: "22, part 1 (information on processing: grounds and purposes … cross-border transfer)"
    articles: ["22"]
    quote_uz: "shaxsga doir maʼlumotlarga ishlov berish asoslari va maqsadlari; … shaxsga doir maʼlumotlarga ishlov berish muddatlari, shu jumladan ularni saqlash muddatlari; ushbu Qonunning 30-moddasida nazarda tutilgan huquqlarning subyekt tomonidan amalga oshirilish tartibi; shaxsga doir maʼlumotlarning amalga oshirilgan yoki moʻljallanilayotgan transchegaraviy uzatilishi toʻgʻrisidagi axborot."
    quote_ru: "основания и цели обработки персональных данных; … сроки обработки персональных данных, в том числе сроки их хранения; порядок осуществления субъектом прав, предусмотренных статьей 30 настоящего Закона; информацию об осуществленной или предполагаемой трансграничной передаче персональных данных."
    url: "https://lex.uz/docs/-4396419"
    url_ru: "https://lex.uz/ru/docs/4396428"
    edition_date: "12.09.2026"
  - act: "ZRU-547"
    article: "23, part 1 (notice of purposes and rights)"
    articles: ["23"]
    quote_uz: "Subyekt oʻzining shaxsga doir maʼlumotlari shaxsga doir maʼlumotlar bazasiga kiritilayotganda shaxsga doir maʼlumotlarga ishlov berish maqsadlari, ushbu Qonunning 30-moddasida belgilangan oʻz huquqlari haqida yozma shaklda xabardor qilinishi kerak."
    quote_ru: "Субъект при включении его персональных данных в базу персональных данных должен быть уведомлен в письменной форме о целях обработки персональных данных, его правах, определенных статьей 30 настоящего Закона."
    url: "https://lex.uz/docs/-4396419"
    url_ru: "https://lex.uz/ru/docs/4396428"
    edition_date: "12.09.2026"
sanction: null   # incomplete notice is not a separate offence in the Codes; see research/legal-liability.md
fix:
  en: "Add the missing items listed in the evidence. At minimum: purposes and legal grounds, the subject's rights and how to use them (art. 23), then retention, recipients and countries, operator name and postal address (art. 22)."
  ru: "Добавьте недостающие пункты из доказательств. Как минимум: цели и правовые основания, права субъекта и порядок их реализации (ст. 23), затем сроки хранения, получатели и страны, наименование и почтовый адрес оператора (ст. 22)."
  uz: "Dalillarda koʻrsatilgan yetishmayotgan bandlarni qoʻshing. Eng kamida: maqsadlar va huquqiy asoslar, subyekt huquqlari va ulardan foydalanish tartibi (23-modda), soʻng saqlash muddatlari, qabul qiluvchilar va davlatlar, operator nomi va pochta manzili (22-modda)."
verified: true
author: "Role 2 (R-03, 21.11.2026)"
